<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1622">
<title>Лутик — общая комната</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- ───────── экран создания ───────── -->
<section id="screen-create" class="screen screen-create">
  <div class="create-card">
    <h1 class="logo">Лутик</h1>
    <p class="tagline">Общая комната для тех, кто далеко</p>

    <label class="field">
      <span>Как назовём комнату</span>
      <input id="room-name" type="text" maxlength="60" placeholder="Наша комната" autocomplete="off">
    </label>

    <div class="field">
      <span>Фон</span>
      <div id="bg-picker" class="bg-picker"></div>
    </div>

    <button id="create-btn" class="primary">Создать комнату</button>
    <p id="create-error" class="error" hidden></p>
  </div>
</section>

<!-- ───────── экран комнаты ───────── -->
<section id="screen-room" class="screen screen-room" hidden>
  <div id="stage" class="stage">
    <div id="objects" class="objects"></div>
  </div>

  <header class="top-bar">
    <div class="room-title" id="room-title">Комната</div>
    <button id="share-btn" class="icon-btn" title="Поделиться ссылкой" aria-label="Поделиться ссылкой">
      <svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
    </button>
  </header>

  <div id="selection-panel" class="selection-panel" hidden>
    <div class="sel-head">
      <span id="sel-author" class="sel-author"></span>
      <button id="sel-close" class="ghost-btn">Готово</button>
    </div>
    <div class="sliders">
      <label><span>Наклон ↕</span><input type="range" id="sl-rx" min="-180" max="180" step="1" value="0"></label>
      <label><span>Поворот ↔</span><input type="range" id="sl-ry" min="-180" max="180" step="1" value="0"></label>
      <label><span>Вращение ⟳</span><input type="range" id="sl-rz" min="-180" max="180" step="1" value="0"></label>
      <label><span>Размер</span><input type="range" id="sl-scale" min="0.2" max="3" step="0.01" value="1"></label>
    </div>
    <div class="sel-actions">
      <button id="sel-reset" class="ghost-btn">Сбросить поворот</button>
      <button id="sel-delete" class="danger-btn">Удалить</button>
    </div>
  </div>

  <nav class="bottom-bar">
    <button id="add-btn" class="round-btn add" aria-label="Добавить объект">
      <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
    </button>
    <button id="user-btn" class="user-chip" aria-label="Сменить пользователя">
      <span id="user-dot" class="user-dot"></span>
      <span id="user-name">…</span>
    </button>
  </nav>

  <div id="conn-badge" class="conn-badge" hidden>нет связи — переподключаюсь…</div>
</section>

<!-- ───────── модалки ───────── -->
<div id="modal-root" class="modal-root" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal" id="modal"></div>
</div>

<input type="file" id="file-input" accept="image/*" hidden>

<script src="/app.js" type="module"></script>
</body>
</html>
